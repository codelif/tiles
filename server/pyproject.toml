[project]
name = "server"
version = "0.1.0"
description = "Local MLX inference server for the Tiles CLI"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.119.0",
    "uvicorn==0.38.0",
    "mlx==0.31.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "openai-harmony==0.0.8",
    "httpx==0.28.1",
    "openresponses-types",
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.25-cu124/llama_cpp_python-0.3.25-py3-none-linux_x86_64.whl#sha256=d4651fe74e66275aa1f6f16027bc9113c91cc828c421c156151c3d392a27020d ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["backend", "backend.*"]

[tool.uv]
exclude-newer="2026-06-02T19:44:30+05:30"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
]
