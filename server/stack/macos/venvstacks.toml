[[runtimes]]
name = "cpython3.13"
python_implementation = "cpython@3.13.11"
requirements = []
macosx_target = "14"
platforms = [
    "macosx_arm64",
]


[[applications]]
name = "server"
launch_module = "../../main.py"
runtime = "cpython3.13"
requirements = [
    "fastapi==0.130.0",
    "uvicorn==0.38.0",
    "openresponses-types",
    "httpx==0.28.1",
    ]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
exclude-newer = "2026-06-02T19:44:30+05:30"

[tool.uv.exclude-newer-package]
 tiles-harmony="2026-06-20T03:01:00Z"
