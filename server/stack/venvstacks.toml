[[runtimes]]
name = "cpython3.13"
python_implementation = "cpython@3.13.11"
requirements = []
platforms = [
    "macosx_arm64",
    "linux_x86_64",
]


[[frameworks]]
name = "mlx"
runtime = "cpython3.13"
linux_target = "glibc@2.35"
macosx_target = "14"
requirements = [
    "mlx==0.31.1"
]

[[applications]]
name = "server"
launch_module = "../main.py"
frameworks = ["mlx"]
requirements = [
    "fastapi==0.119.0",
    "uvicorn==0.38.0",
    "mlx-lm==0.31.0",
    "openai-harmony==0.0.8",
    "llama-cpp-python==0.3.25; sys_platform == 'linux'",
    "openresponses-types",
    "httpx==0.28.1",
    ]

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
name = "llama_cpp-python-cuda"

# This index does not include upload times, so exclude-newer filters its Linux wheels.
# Only resolve for the relevant target platforms
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
